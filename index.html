<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vidra – Video-Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Anton&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#14161c;
  --bg-panel:#1b1e26;
  --bg-elevated:#252932;
  --bg-elevated-2:#2e333e;
  --border:#343a47;
  --border-soft:#2a2f3a;
  --text:#edeef2;
  --text-muted:#8a90a0;
  --text-faint:#5c6272;
  --accent:#e8a33d;
  --accent-dim:#8a6326;
  --track-audio:#5fa8d9;
  --track-audio-dim:#33587a;
  --track-overlay:#c07de0;
  --track-overlay-dim:#5f3f70;
  --rec:#e2483d;
  --ok:#5fbf8e;
  --radius-s:4px;
  --radius-m:8px;
  --font-ui:'Space Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg-base);color:var(--text);font-family:var(--font-ui);
  font-size:14px;overflow:hidden;
}
button{font-family:var(--font-ui);cursor:pointer;}
input,select{font-family:var(--font-ui);}
::selection{background:var(--accent);color:#1a1200;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:linear-gradient(180deg,#1e222c,var(--bg-panel));
  border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;
}
.brand-wrap{display:flex;flex-direction:column;flex-shrink:0;line-height:1;}
.brand{font-weight:700;font-size:17px;color:var(--accent);}
.brand-sub{font-size:8px;letter-spacing:1.5px;color:var(--text-faint);font-weight:600;}
.project-name-input{
  background:transparent;border:1px solid transparent;color:var(--text);font-size:14px;
  padding:6px 8px;border-radius:var(--radius-s);min-width:0;flex:1 1 160px;max-width:240px;
}
.project-name-input:hover{border-color:var(--border);}
.project-name-input:focus{outline:none;border-color:var(--accent-dim);background:var(--bg-elevated);}
.save-status{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px;}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.save-status.saved .dot{background:var(--ok);}
.save-status.pending .dot{background:var(--accent);}
.save-status.error .dot{background:var(--rec);}
.top-actions{display:flex;gap:7px;margin-left:auto;flex-shrink:0;}
.btn{
  background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);padding:8px 12px;
  border-radius:var(--radius-s);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s;
}
.btn:hover{background:var(--bg-elevated-2);border-color:var(--text-faint);}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,#f0ae4d,var(--accent));border-color:var(--accent);color:#1a1200;font-weight:700;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger-outline{border-color:#e2483d;color:#e2483d;background:transparent;}
.btn.danger-outline:hover{background:rgba(226,72,61,.12);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:disabled:hover{background:var(--bg-elevated);}
.file-btn{display:inline-flex;align-items:center;}

/* ---------- Workspace ---------- */
.workspace{flex:1;display:grid;grid-template-columns:210px 1fr 310px;min-height:0;}
.panel{background:var(--bg-panel);display:flex;flex-direction:column;min-height:0;}
.media-panel{border-right:1px solid var(--border);}
.inspector-panel{border-left:1px solid var(--border);}
.panel-head{padding:11px 12px 6px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.panel-section{border-top:1px solid var(--border-soft);padding-top:2px;margin-top:4px;}

/* ---------- Media list ---------- */
.media-list{flex:1;overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:6px;}
.list-scroll{max-height:180px;overflow-y:auto;padding:0 8px 6px;display:flex;flex-direction:column;gap:5px;}
.media-item{
  display:flex;gap:8px;align-items:center;background:var(--bg-elevated);border:1px solid var(--border-soft);
  border-radius:var(--radius-m);padding:6px;cursor:pointer;position:relative;
}
.media-item:hover{border-color:var(--text-faint);}
.media-item.selected{border-color:var(--accent);}
.media-item.selected.audio-type{border-color:var(--track-audio);}
.media-item.selected.overlay-type{border-color:var(--track-overlay);}
.media-thumb{width:40px;height:30px;border-radius:var(--radius-s);background:#000;object-fit:cover;flex-shrink:0;}
.media-thumb.missing{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-faint);}
.media-thumb.emoji{display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg-elevated-2);}
.media-info{min-width:0;flex:1;}
.media-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.media-dur{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
.media-actions{display:flex;flex-direction:column;gap:2px;}
.icon-btn{background:none;border:none;color:var(--text-faint);font-size:12px;padding:3px 5px;line-height:1;border-radius:3px;}
.icon-btn:hover{color:var(--text);background:var(--bg-elevated-2);}
.relink-row{padding:6px;background:var(--bg-elevated);border:1px dashed var(--accent-dim);border-radius:var(--radius-m);}
.relink-row .rl-name{font-size:11px;color:var(--accent);margin-bottom:5px;}
.relink-row label.file-btn{font-size:10.5px;padding:5px 8px;}
.empty-hint{padding:14px 10px;color:var(--text-faint);font-size:11.5px;line-height:1.5;}
.add-row{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;}
.cat-pill-row{display:flex;gap:4px;flex-wrap:wrap;padding:0 8px 6px;}
.cat-pill{background:var(--bg-elevated);border:1px solid var(--border-soft);color:var(--text-muted);font-size:9.5px;padding:4px 8px;border-radius:12px;}
.cat-pill.active{background:var(--track-overlay-dim);color:#fff;border-color:var(--track-overlay);}
.sticker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 8px 10px;}
.sticker-grid button{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius-s);font-size:18px;padding:5px 0;}
.sticker-grid button:hover{background:var(--bg-elevated-2);border-color:var(--track-overlay);}
.hint-line{font-size:10px;color:var(--text-faint);padding:0 8px 8px;line-height:1.4;}

/* ---------- Stage ---------- */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0;position:relative;padding:8px;}
#preview{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000;border-radius:2px;touch-action:none;}
.rec-indicator{
  position:absolute;top:16px;left:16px;background:rgba(226,72,61,.15);border:1px solid var(--rec);color:var(--rec);
  font-family:var(--font-mono);font-size:11.5px;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;
}
.rec-indicator::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--rec);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25;}}
.hidden{display:none !important;}

.transport{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--border);flex-shrink:0;}
.transport-btn{
  width:32px;height:32px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);
  color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.transport-btn:hover{background:var(--bg-elevated-2);}
.transport-btn.accent{color:var(--accent);border-color:var(--accent-dim);}
.timecode{font-family:var(--font-mono);font-size:12px;}
.timecode.muted{color:var(--text-muted);}
.timecode-sep{color:var(--text-faint);}
.spacer{flex:1;}
.mini-label{font-size:10.5px;color:var(--text-muted);}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--bg-elevated-2);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #14161c;}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #14161c;}
#volumeRange{width:70px;}

/* ---------- Timeline toolbar ---------- */
.tl-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--border);background:var(--bg-panel);flex-shrink:0;}
.tl-toolbar .btn{padding:6px 10px;font-size:11.5px;}
.zoom-group{display:flex;align-items:center;gap:4px;margin-left:auto;}
.zoom-group button{width:26px;height:26px;border-radius:var(--radius-s);background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);font-size:14px;}
.zoom-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);width:38px;text-align:center;}

/* ---------- Timeline ---------- */
.timeline-wrap{display:flex;height:196px;flex-shrink:0;border-top:1px solid var(--border);background:var(--bg-panel);}
.track-labels{width:56px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border-soft);}
.track-labels .tl-lbl{font-size:9.5px;color:var(--text-faint);display:flex;align-items:center;padding-left:8px;font-weight:600;letter-spacing:.3px;}
.tl-lbl.ruler-lbl{height:18px;}
.tl-lbl.video-lbl{height:60px;color:var(--accent);}
.tl-lbl.audio-lbl{height:52px;color:var(--track-audio);}
.tl-lbl.overlay-lbl{height:52px;color:var(--track-overlay);}
.timeline-scroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;}
.timeline-inner{position:relative;height:100%;min-width:100%;}
.timeline-ruler{height:18px;position:relative;border-bottom:1px solid var(--border-soft);}
.ruler-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--border-soft);font-family:var(--font-mono);font-size:9px;color:var(--text-faint);padding-left:3px;}
.track-row{position:relative;border-bottom:1px solid var(--border-soft);}
.track-row.video-row{height:60px;}
.track-row.audio-row{height:52px;}
.track-row.overlay-row{height:52px;}
.track-empty-msg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:11px;}

.blk{position:absolute;top:6px;bottom:6px;border-radius:var(--radius-s);overflow:hidden;border:1.5px solid var(--border);background:var(--bg-elevated);cursor:grab;}
.blk:active{cursor:grabbing;}
.blk.video-blk.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);z-index:2;}
.blk.video-blk.missing{background:repeating-linear-gradient(45deg,#241f1a,#241f1a 6px,#1b1815 6px,#1b1815 12px);border-color:var(--accent-dim);}
.blk.audio-blk{background:var(--track-audio-dim);border-color:var(--track-audio-dim);}
.blk.audio-blk.selected{border-color:var(--track-audio);box-shadow:0 0 0 1px var(--track-audio);}
.blk.overlay-blk{background:var(--track-overlay-dim);border-color:var(--track-overlay-dim);}
.blk.overlay-blk.selected{border-color:var(--track-overlay);box-shadow:0 0 0 1px var(--track-overlay);}
.blk-body{position:absolute;inset:0;left:5px;right:5px;padding:3px 5px;display:flex;flex-direction:column;gap:1px;pointer-events:none;}
.blk-title{font-size:10.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.blk-dur{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.65);}
.blk-kf-row{position:absolute;bottom:2px;left:5px;right:5px;height:6px;pointer-events:none;}
.kf-dot{position:absolute;width:5px;height:5px;background:var(--accent);border-radius:1px;transform:translateX(-50%) rotate(45deg);bottom:0;}
.blk-handle{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.06);}
.blk-handle.left{left:0;border-right:1px solid rgba(255,255,255,.15);}
.blk-handle.right{right:0;border-left:1px solid rgba(255,255,255,.15);}
.blk-handle:hover{background:rgba(255,255,255,.25);}
.blk-top-btn{position:absolute;top:1px;background:none;border:none;color:rgba(255,255,255,.55);font-size:9px;line-height:1;padding:2px;}
.blk-top-btn:hover{color:#fff;}
.blk-del{right:2px;}
.blk-dup{right:15px;}
.trans-badge{
  position:absolute;top:6px;bottom:6px;background:repeating-linear-gradient(45deg,rgba(232,163,61,.4),rgba(232,163,61,.4) 4px,rgba(232,163,61,.15) 4px,rgba(232,163,61,.15) 8px);
  border:1px solid var(--accent-dim);border-radius:3px;z-index:3;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff9ec;pointer-events:none;
}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:5;pointer-events:none;}
.playhead::before{content:'';position:absolute;top:0;left:-4px;width:9px;height:9px;background:var(--accent);border-radius:1px 1px 1px 0;transform:rotate(45deg);}

/* ---------- Inspector ---------- */
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.tab{flex:1 0 auto;min-width:58px;background:none;border:none;color:var(--text-muted);padding:10px 6px;font-size:11px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab:hover{color:var(--text);}
.tab-content{flex:1;overflow-y:auto;padding:12px;min-height:0;}
.no-selection{color:var(--text-faint);font-size:12px;line-height:1.6;padding-top:8px;}
.section-title{font-size:10.5px;font-weight:700;color:var(--text-muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
.section-title:first-child{margin-top:0;}
.eff-row{margin-bottom:15px;}
.eff-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.eff-label{font-size:12px;color:var(--text);}
.eff-value{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);}
.eff-controls{display:flex;align-items:center;gap:8px;}
.eff-controls input[type=range]{flex:1;}
.kf-add-btn{width:24px;height:24px;flex-shrink:0;border-radius:var(--radius-s);background:var(--bg-elevated);border:1px solid var(--border);color:var(--accent);font-size:13px;display:flex;align-items:center;justify-content:center;}
.kf-add-btn:hover{background:var(--bg-elevated-2);}
.kf-add-btn.has-kf{background:var(--accent);color:#1a1200;border-color:var(--accent);}
.kf-clear-hint{font-size:10px;color:var(--text-faint);margin-top:3px;line-height:1.5;}
.kf-clear-hint button{background:none;border:none;color:var(--text-faint);text-decoration:underline;font-size:10px;padding:0;}
.kf-clear-hint button:hover{color:var(--rec);}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.quick-row .btn{padding:6px 9px;font-size:11px;}

.text-field{margin-bottom:13px;}
.text-field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;}
.text-field input[type=text]{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:var(--radius-s);font-size:13px;}
.text-field input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg-elevated);}
.text-row2{display:flex;gap:10px;}
.text-row2 > div{flex:1;}
.sel-input{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:var(--radius-s);font-size:12.5px;}
.chk-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin-bottom:11px;cursor:pointer;}
.chk-row input{width:16px;height:16px;flex-shrink:0;accent-color:var(--accent);}
.del-full-btn{width:100%;margin-top:6px;}

.kf-group{margin-bottom:13px;}
.kf-group-title{font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.kf-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-elevated);border-radius:var(--radius-s);margin-bottom:4px;font-family:var(--font-mono);font-size:10.5px;cursor:pointer;}
.kf-item:hover{background:var(--bg-elevated-2);}
.kf-item .t{color:var(--accent);width:48px;flex-shrink:0;}
.kf-item .v{flex:1;color:var(--text-muted);}
.kf-item button{background:none;border:none;color:var(--text-faint);font-size:12px;}
.kf-item button:hover{color:var(--rec);}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,11,14,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-m);width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.modal-head h2{font-size:15px;margin:0;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:16px 18px;overflow-y:auto;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;color:var(--text-muted);}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

.restore-banner{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);
  border:1px solid var(--accent-dim);color:var(--text);padding:10px 16px;border-radius:var(--radius-m);
  font-size:12px;z-index:40;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:88vw;
}
.restore-banner button{background:none;border:none;color:var(--text-faint);font-size:16px;padding:0;flex-shrink:0;}

/* ---------- Mobile nav ---------- */
.mobile-nav{display:none;}

@media (max-width:900px){
  .workspace{grid-template-columns:1fr;grid-template-rows:1fr;}
  .media-panel,.inspector-panel{position:absolute;inset:0;top:49px;bottom:48px;z-index:20;}
  .media-panel{display:none;}
  .inspector-panel{display:none;}
  .workspace[data-mobile="media"] .media-panel{display:flex;}
  .workspace[data-mobile="inspector"] .inspector-panel{display:flex;}
  .workspace:not([data-mobile="stage"]) .stage{display:none;}
  .workspace[data-mobile="stage"] .stage{display:flex;}
  .mobile-nav{display:flex;flex-shrink:0;background:var(--bg-panel);border-top:1px solid var(--border);position:relative;z-index:25;}
  .mobile-nav button{flex:1;background:none;border:none;color:var(--text-muted);padding:11px 0;font-size:11.5px;font-weight:500;border-top:2px solid transparent;}
  .mobile-nav button.active{color:var(--accent);border-top-color:var(--accent);}
  .top-actions{gap:5px;}
  .btn{padding:7px 9px;font-size:11.5px;}
  .project-name-input{max-width:90px;flex:0 1 90px;}
  .brand-wrap{display:none;}
  .timeline-wrap{height:168px;}
  .track-row.video-row{height:52px;}
  .track-row.audio-row,.track-row.overlay-row{height:46px;}
  .tl-lbl.video-lbl{height:52px;}
  .tl-lbl.audio-lbl,.tl-lbl.overlay-lbl{height:46px;}
  .icon-btn,.blk-top-btn{padding:5px 6px;font-size:12px;}
  .blk-handle{width:13px;}
}
@media (max-width:480px){
  #timeTotal,.timecode-sep{display:none;}
  .mini-label{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-wrap"><div class="brand">Vidra</div><div class="brand-sub">STUDIO</div></div>
    <input id="projectName" class="project-name-input" value="Unbenanntes Projekt" spellcheck="false">
    <div class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">noch nicht gespeichert</span></div>
    <div class="top-actions">
      <button class="btn" id="btnReport">Bericht</button>

<script>
(function(){
"use strict";

/* ===================== Konstanten ===================== */
const EFFECT_PROPS = [
  {key:'brightness', label:'Helligkeit',    min:0,   max:200, step:1,   unit:'%',  def:100},
  {key:'contrast',   label:'Kontrast',      min:0,   max:200, step:1,   unit:'%',  def:100},
  {key:'saturation', label:'Sättigung',     min:0,   max:200, step:1,   unit:'%',  def:100},
  {key:'hue',        label:'Farbton',       min:-180,max:180, step:1,   unit:'°',  def:0},
  {key:'blur',       label:'Weichzeichner', min:0,   max:20,  step:0.5, unit:'px', def:0},
  {key:'grayscale',  label:'Graustufen',    min:0,   max:100, step:1,   unit:'%',  def:0},
  {key:'sepia',      label:'Sepia',         min:0,   max:100, step:1,   unit:'%',  def:0},
  {key:'vignette',   label:'Vignette',      min:0,   max:100, step:1,   unit:'%',  def:0},
  {key:'temperature',label:'Farbtemperatur',min:-100,max:100, step:1,   unit:'',   def:0},
  {key:'opacity',    label:'Deckkraft',     min:0,   max:100, step:1,   unit:'%',  def:100},
  {key:'scale',      label:'Zoom',          min:20,  max:300, step:1,   unit:'%',  def:100},
  {key:'posX',       label:'Position X',    min:-50, max:50,  step:1,   unit:'%',  def:0},
  {key:'posY',       label:'Position Y',    min:-50, max:50,  step:1,   unit:'%',  def:0},
];
const STICKER_CATS = {
  'Gesichter': ['😀','😂','😍','🤩','😎','😱','🥳','😴','🤔','😉','😭','🤯'],
  'Herzen & Feiern': ['❤️','💯','🎉','✨','🎈','🎁','🏆','💫','💥','🙌','👏','💪'],
  'Natur & Wetter': ['🔥','⭐','🌈','☀️','🌙','⚡','🍕','🌊','🌸','❄️','🌵','🍀'],
  'Objekte & Symbole': ['🚀','🎵','🎬','📸','✅','💡','⏰','📍','💰','🔒','🎯','🔔'],
};
const FONT_CHOICES = [
  ['Space Grotesk','Space Grotesk (Standard)'],
  ['Anton','Anton (Fett / Titel)'],
  ['Caveat','Caveat (Handschrift)'],
  ['JetBrains Mono','JetBrains Mono'],
  ['Arial','Arial'],
  ['Georgia','Georgia (Serif)'],
  ['Courier New','Courier New'],
];
const TRANSITION_TYPES = [
  ['none','Kein Übergang (harter Schnitt)'],
  ['dissolve','Überblenden'],
  ['fadeblack','Über Schwarz'],
  ['wipe-left','Wischen (nach links)'],
  ['wipe-right','Wischen (nach rechts)'],
  ['slide-left','Schieben (nach links)'],
  ['slide-right','Schieben (nach rechts)'],
];
const MAX_EMBED_BYTES = 20*1024*1024;
const MAX_AUDIO_EMBED_BYTES = 10*1024*1024;
const MAX_IMG_EMBED_BYTES = 6*1024*1024;
const AUTOSAVE_KEY = 'vidra_project_v3';
let PX_PER_SEC = 60;

/* ===================== Zustand ===================== */
let state = {
  projectName:'Unbenanntes Projekt',
  createdAt: Date.now(),
  clips: [],
  audioClips: [],
  overlays: [],
  selection: {type:null, id:null},
  playheadTime: 0,
  isPlaying:false,
  exportHistory: [],
  lastSavedAt: null,
  isExporting:false,
};

let audioCtx=null, streamDest=null;
let mediaRecorder=null, recChunks=[], recStartTime=0;
let scrubbing=false, lastTickTs=null;
let autosaveTimer=null;
let hasStorageApi = (typeof window.storage !== 'undefined');
let overlayImgCache = {};
let activeStickerCat = Object.keys(STICKER_CATS)[0];

/* ===================== Hilfsfunktionen ===================== */
function uid(){ return 'c'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtTime(t){
  if(!isFinite(t)||t<0) t=0;
  const m = Math.floor(t/60);
  const s = t-m*60;
  return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0');
}
function fmtClock(t){
  const m=Math.floor(t/60), s=Math.floor(t%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtClock2(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function fmtBytes(b){
  if(b==null) return '–';
  if(b<1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/1024/1024).toFixed(1)+' MB';
}
function sanitizeFilename(s){
  return (s||'projekt').trim().replace(/[^a-z0-9\-_ äöüß]/gi,'').replace(/\s+/g,'_').slice(0,60) || 'projekt';
}
function downloadBlob(content, filename, mime){
  const blob = (content instanceof Blob) ? content : new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
function dataURLToBlob(dataURL){
  const [head, b64] = dataURL.split(',');
  const mime = head.match(/data:(.*?);base64/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function defaultEffects(){ const o={}; EFFECT_PROPS.forEach(p=>o[p.key]=p.def); return o; }
function defaultKeyframes(){ const o={}; EFFECT_PROPS.forEach(p=>o[p.key]=[]); return o; }
function mergeEffects(saved){ return Object.assign(defaultEffects(), saved||{}); }
function mergeKeyframes(saved){ return Object.assign(defaultKeyframes(), saved||{}); }
function roundRectPath(c, x, y, w, h, r){
  r = Math.max(0, Math.min(r, Math.min(w,h)/2));
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.arcTo(x+w, y, x+w, y+r, r);
  c.lineTo(x+w, y+h-r);
  c.arcTo(x+w, y+h, x+w-r, y+h, r);
  c.lineTo(x+r, y+h);
  c.arcTo(x, y+h, x, y+h-r, r);
  c.lineTo(x, y+r);
  c.arcTo(x, y, x+r, y, r);
  c.closePath();
}

/* ===================== Video-Clip-Modell ===================== */
function createClipFromFile(file, restoreData){
  const clip = {
    id: (restoreData && restoreData.id) || uid(),
    name: (restoreData && restoreData.name) || file.name,
    sourceFile: file,
    url: URL.createObjectURL(file),
    videoEl: null,
    duration: (restoreData && restoreData.duration) || 0,
    trimIn: (restoreData && restoreData.trimIn) || 0,
    trimOut: (restoreData && restoreData.trimOut) || 0,
    effects: mergeEffects(restoreData && restoreData.effects),
    keyframes: mergeKeyframes(restoreData && restoreData.keyframes),
    text: (restoreData && restoreData.text) || {content:'', size:36, color:'#ffffff', x:50, y:88},
    flipH: (restoreData && restoreData.flipH) || false,
    transitionOut: (restoreData && restoreData.transitionOut) || {type:'none', duration:0.6},
    needsRelink:false, thumb:null, gainNode:null, audioConnected:false,
  };
  attachVideoElement(clip, !!restoreData);
  return clip;
}
function createPlaceholderClip(meta){
  return {
    id: meta.id || uid(), name: meta.name || 'Video', sourceFile:null, url:null, videoEl:null,
    duration: meta.duration||0, trimIn: meta.trimIn||0, trimOut: meta.trimOut||meta.duration||0,
    effects: mergeEffects(meta.effects), keyframes: mergeKeyframes(meta.keyframes),
    text: meta.text || {content:'', size:36, color:'#ffffff', x:50, y:88},
    flipH: meta.flipH||false, transitionOut: meta.transitionOut || {type:'none', duration:0.6},
    needsRelink:true, thumb:null, gainNode:null, audioConnected:false, fileSizeHint: meta.fileSize||null,
  };
}
function attachVideoElement(clip, isRestore){
  const v = document.createElement('video');
  v.src = clip.url; v.preload='auto'; v.playsInline=true; v.muted=false; v.crossOrigin='anonymous';
  document.getElementById('hiddenVideos').appendChild(v);
  clip.videoEl = v;
  v.addEventListener('loadedmetadata', ()=>{
    if(!isRestore || !clip.duration){ clip.duration=v.duration; clip.trimIn=0; clip.trimOut=v.duration; }
    else { clip.trimOut = Math.min(clip.trimOut||v.duration, v.duration); clip.duration=v.duration; }
    generateThumb(clip);
    renderAll(); queueAutosave();
  });
}
function generateThumb(clip){
  try{
    const c = document.createElement('canvas'); c.width=80; c.height=60;
    const draw = ()=>{
      const c2=c.getContext('2d');
      c2.fillStyle='#000'; c2.fillRect(0,0,c.width,c.height);
      const vw=clip.videoEl.videoWidth, vh=clip.videoEl.videoHeight;
      if(vw&&vh){
        const s=Math.min(c.width/vw,c.height/vh);
        const w=vw*s,h=vh*s;
        c2.drawImage(clip.videoEl,(c.width-w)/2,(c.height-h)/2,w,h);
      }
      clip.thumb = c.toDataURL('image/jpeg',0.6);
      renderMediaList();
    };
    if(clip.videoEl.readyState>=2) draw();
    else clip.videoEl.addEventListener('loadeddata', draw, {once:true});
  }catch(e){}
}
function clipDuration(c){ return Math.max(0,(c.trimOut||0)-(c.trimIn||0)); }

/* ===================== Video-Layout (mit Übergängen) ===================== */
function getEffectiveTransitionDur(c, next){
  if(!c || !next) return 0;
  const want = (c.transitionOut && c.transitionOut.type!=='none') ? (c.transitionOut.duration||0) : 0;
  if(want<=0) return 0;
  return Math.max(0, Math.min(want, clipDuration(c)*0.9, clipDuration(next)*0.9));
}
function computeVideoLayout(){
  const layout=[];
  let cursor=0;
  state.clips.forEach((c,i)=>{
    const d = clipDuration(c);
    const start = cursor;
    layout.push({clip:c, start, end:start+d});
    const next = state.clips[i+1];
    const tOut = next ? getEffectiveTransitionDur(c, next) : 0;
    cursor = start + d - tOut;
  });
  return layout;
}
function clipDisplayStart(clip){
  const layout = computeVideoLayout();
  const e = layout.find(x=>x.clip===clip);
  return e ? e.start : 0;
}
function localTimeForClipAtPlayhead(clip){
  const start = clipDisplayStart(clip);
  return clamp(state.playheadTime-start, 0, clipDuration(clip));
}
function overlaysAudioMaxEnd(){
  let m=0;
  state.overlays.forEach(o=>{ m=Math.max(m,o.end); });
  state.audioClips.forEach(a=>{ m=Math.max(m, a.startTime+(a.trimOut-a.trimIn)); });
  return m;
}
function timelineLength(){
  const layout = computeVideoLayout();
  const vt = layout.length ? layout[layout.length-1].end : 0;
  return Math.max(vt, overlaysAudioMaxEnd());
}

/* ===================== Keyframes ===================== */
function upsertKeyframe(clip, prop, t, v){
  const list = clip.keyframes[prop];
  const tol = 0.05;
  const existing = list.find(k=>Math.abs(k.t-t)<tol);
  if(existing) existing.v=v;
  else{ list.push({t,v}); list.sort((a,b)=>a.t-b.t); }
  queueAutosave();
}
function deleteKeyframe(clip, prop, idx){ clip.keyframes[prop].splice(idx,1); queueAutosave(); }
function clearKeyframes(clip, prop){ clip.keyframes[prop]=[]; queueAutosave(); }
function computeEffectValues(clip, localTime){
  const vals={};
  for(const p of EFFECT_PROPS){
    const kfs = clip.keyframes[p.key];
    if(!kfs || kfs.length===0){ vals[p.key]=clip.effects[p.key]; continue; }
    if(kfs.length===1){ vals[p.key]=kfs[0].v; continue; }
    if(localTime<=kfs[0].t){ vals[p.key]=kfs[0].v; continue; }
    if(localTime>=kfs[kfs.length-1].t){ vals[p.key]=kfs[kfs.length-1].v; continue; }
    let lo=kfs[0], hi=kfs[kfs.length-1];
    for(let i=0;i<kfs.length-1;i++){ if(localTime>=kfs[i].t && localTime<=kfs[i+1].t){ lo=kfs[i]; hi=kfs[i+1]; break; } }
    const span = hi.t-lo.t;
    const frac = span<=0 ? 0 : (localTime-lo.t)/span;
    vals[p.key] = lo.v + (hi.v-lo.v)*frac;
  }
  return vals;
}

/* ===================== Schneiden / Duplizieren ===================== */
function redistributeKeyframesForSplit(original, clone, splitLocalTime){
  EFFECT_PROPS.forEach(p=>{
    const kfs = original.keyframes[p.key];
    const before = kfs.filter(k=>k.t<=splitLocalTime);
    const after = kfs.filter(k=>k.t>splitLocalTime).map(k=>({t:k.t-splitLocalTime, v:k.v}));
    original.keyframes[p.key] = before;
    clone.keyframes[p.key] = after;
  });
}
function splitClipAtPlayhead(){
  const layout = computeVideoLayout();
  const videoTotal = layout.length? layout[layout.length-1].end : 0;
  const t = clamp(state.playheadTime, 0, videoTotal);
  const active = layout.filter(e=> t>=e.start && t<e.end);
  if(active.length!==1) return;
  const entry = active[0], clip = entry.clip;
  const localTime = clamp(t-entry.start, 0, clipDuration(clip));
  if(localTime<=0.08 || localTime>=clipDuration(clip)-0.08) return;
  const splitAbs = clip.trimIn+localTime;
  const oldTransition = clip.transitionOut ? {...clip.transitionOut} : null;
  const clone = {
    id:uid(), name: clip.name, sourceFile: clip.sourceFile, url: clip.url, videoEl:null,
    duration: clip.duration, trimIn: splitAbs, trimOut: clip.trimOut,
    effects: {...clip.effects}, keyframes: defaultKeyframes(),
    text: {...clip.text}, flipH: clip.flipH,
    transitionOut: oldTransition || {type:'none', duration:0.6},
    needsRelink:false, thumb: clip.thumb, gainNode:null, audioConnected:false,
  };
  redistributeKeyframesForSplit(clip, clone, localTime);
  clip.trimOut = splitAbs;
  clip.transitionOut = {type:'none', duration:0.6};
  attachVideoElement(clone, true);
  const idx = state.clips.indexOf(clip);
  state.clips.splice(idx+1,0,clone);
  state.selection = {type:'video', id: clone.id};
  renderAll(); queueAutosave();
}
function duplicateSelectedVideoClip(){
  const clip = selectedClip();
  if(!clip || clip.needsRelink) return;
  const dup = {
    id:uid(), name: clip.name+' Kopie', sourceFile: clip.sourceFile, url: clip.url, videoEl:null,
    duration: clip.duration, trimIn: clip.trimIn, trimOut: clip.trimOut,
    effects: {...clip.effects}, keyframes: JSON.parse(JSON.stringify(clip.keyframes)),
    text: {...clip.text}, flipH: clip.flipH, transitionOut: {type:'none', duration:0.6},
    needsRelink:false, thumb: clip.thumb, gainNode:null, audioConnected:false,
  };
  attachVideoElement(dup, true);
  const idx = state.clips.indexOf(clip);
  state.clips.splice(idx+1,0,dup);
  state.selection = {type:'video', id: dup.id};
  renderAll(); queueAutosave();
}

/* ===================== Rendering (Canvas) ===================== */
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');
let bufCanvasA=null, bufCanvasB=null;
function getBuf(name){
  let c = name==='A'?bufCanvasA:bufCanvasB;
  if(!c || c.width!==canvas.width || c.height!==canvas.height){
    c = document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height;
    if(name==='A') bufCanvasA=c; else bufCanvasB=c;
  }
  const bctx = c.getContext('2d');
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,c.width,c.height);
  bctx.fillStyle='#000'; bctx.fillRect(0,0,c.width,c.height);
  return c;
}
function syncClipTimeForRender(clip, localTime){
  if(!clip.videoEl) return;
  const target = clip.trimIn+clamp(localTime,0,clipDuration(clip));
  if(!state.isPlaying && Math.abs(clip.videoEl.currentTime-target)>0.05){ try{ clip.videoEl.currentTime=target; }catch(e){} }
  else if(state.isPlaying && Math.abs(clip.videoEl.currentTime-target)>0.35){ try{ clip.videoEl.currentTime=target; }catch(e){} }
}

function renderFrame(){
  const layout = computeVideoLayout();
  const videoTotal = layout.length ? layout[layout.length-1].end : 0;
  const fullTotal = Math.max(videoTotal, overlaysAudioMaxEnd());
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);

  if(fullTotal<=0){
    ctx.fillStyle='#5c6272'; ctx.font='20px "Space Grotesk"'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('Keine Clips in der Timeline', canvas.width/2, canvas.height/2);
    updateTimeDisplays(0,0);
    return;
  }
  const t = clamp(state.playheadTime,0,fullTotal);

  if(t<videoTotal){
    const active = layout.filter(e=> t>=e.start && t<e.end);
    if(active.length===1){
      const e = active[0];
      const localTime = clamp(t-e.start,0,clipDuration(e.clip));
      renderSingleClip(e.clip, localTime);
    } else if(active.length>=2){
      const older = active[0], newer = active[1];
      const tType = (older.clip.transitionOut && older.clip.transitionOut.type!=='none') ? older.clip.transitionOut.type : 'dissolve';
      const winStart = newer.start, winEnd = older.end;
      const w = winEnd-winStart;
      const p = w>0 ? clamp((t-winStart)/w,0,1) : 1;
      renderTransitionFrame(older.clip, t-older.start, newer.clip, t-newer.start, tType, p);
    }
  }
  drawOverlays(t);
  updateTimeDisplays(t, fullTotal);
  updatePlayheadUI(t);
}

function renderSingleClip(clip, localTime){
  if(clip.needsRelink || !clip.videoEl){
    ctx.fillStyle='#5c6272'; ctx.font='16px "Space Grotesk"'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('Kein Video verknüpft – bitte Datei erneut auswählen', canvas.width/2, canvas.height/2);
    return;
  }
  syncClipTimeForRender(clip, localTime);
  const vals = computeEffectValues(clip, localTime);
  drawClipToCanvas(clip, vals, ctx);
}

function renderTransitionFrame(clipA, localA, clipB, localB, transType, p){
  const W=canvas.width, H=canvas.height;
  const bufA = getBuf('A'), bufB = getBuf('B');
  const bctxA = bufA.getContext('2d'), bctxB = bufB.getContext('2d');
  if(!clipA.needsRelink && clipA.videoEl){
    syncClipTimeForRender(clipA, localA);
    drawClipToCanvas(clipA, computeEffectValues(clipA, clamp(localA,0,clipDuration(clipA))), bctxA);
  }
  if(!clipB.needsRelink && clipB.videoEl){
    syncClipTimeForRender(clipB, localB);
    drawClipToCanvas(clipB, computeEffectValues(clipB, clamp(localB,0,clipDuration(clipB))), bctxB);
  }
  ctx.save();
  switch(transType){
    case 'fadeblack':
      if(p<0.5){ ctx.globalAlpha=1-(p/0.5); ctx.drawImage(bufA,0,0); }
      else { ctx.globalAlpha=(p-0.5)/0.5; ctx.drawImage(bufB,0,0); }
      break;
    case 'wipe-left':
      ctx.globalAlpha=1; ctx.drawImage(bufA,0,0);
      ctx.save(); ctx.beginPath(); ctx.rect(W*(1-p),0,W*p,H); ctx.clip(); ctx.drawImage(bufB,0,0); ctx.restore();
      break;
    case 'wipe-right':
      ctx.globalAlpha=1; ctx.drawImage(bufA,0,0);
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,W*p,H); ctx.clip(); ctx.drawImage(bufB,0,0); ctx.restore();
      break;
    case 'slide-left':
      ctx.globalAlpha=1; ctx.drawImage(bufA,-p*W,0);
      ctx.drawImage(bufB, W*(1-p),0);
      break;
    case 'slide-right':
      ctx.globalAlpha=1; ctx.drawImage(bufA,p*W,0);
      ctx.drawImage(bufB, -W*(1-p),0);
      break;
    default: /* dissolve */
      ctx.globalAlpha=1; ctx.drawImage(bufA,0,0);
      ctx.globalAlpha=p; ctx.drawImage(bufB,0,0);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawClipToCanvas(clip, vals, targetCtx){
  targetCtx = targetCtx || ctx;
  const W=canvas.width, H=canvas.height;
  const vw = clip.videoEl.videoWidth||1280, vh = clip.videoEl.videoHeight||720;
  const fit = Math.min(W/vw, H/vh);
  const bw = vw*fit, bh = vh*fit;
  targetCtx.save();
  targetCtx.filter = `brightness(${vals.brightness}%) contrast(${vals.contrast}%) saturate(${vals.saturation}%) blur(${vals.blur}px) hue-rotate(${vals.hue}deg) grayscale(${vals.grayscale}%) sepia(${vals.sepia}%)`;
  targetCtx.globalAlpha = clamp(vals.opacity,0,100)/100;
  const scale = vals.scale/100;
  targetCtx.translate(W/2 + (vals.posX/100)*W, H/2 + (vals.posY/100)*H);
  targetCtx.scale(scale * (clip.flipH?-1:1), scale);
  try{ targetCtx.drawImage(clip.videoEl, -bw/2, -bh/2, bw, bh); }catch(e){}
  targetCtx.restore();

  if(vals.vignette>0){
    targetCtx.save();
    const g = targetCtx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.72);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+(vals.vignette/100)+')');
    targetCtx.fillStyle=g; targetCtx.fillRect(0,0,W,H);
    targetCtx.restore();
  }
  if(vals.temperature && vals.temperature!==0){
    targetCtx.save();
    targetCtx.globalCompositeOperation='overlay';
    targetCtx.globalAlpha = Math.min(Math.abs(vals.temperature)/100,1)*0.5;
    targetCtx.fillStyle = vals.temperature>0 ? '#ff9c40' : '#40a0ff';
    targetCtx.fillRect(0,0,W,H);
    targetCtx.restore();
  }

  if(clip.text && clip.text.content){
    targetCtx.save();
    targetCtx.globalAlpha=1; targetCtx.filter='none';
    targetCtx.fillStyle = clip.text.color||'#fff';
    targetCtx.font = `600 ${clip.text.size}px 'Space Grotesk', sans-serif`;
    targetCtx.textAlign='center'; targetCtx.textBaseline='middle';
    targetCtx.shadowColor='rgba(0,0,0,.6)'; targetCtx.shadowBlur=6;
    targetCtx.fillText(clip.text.content, W*(clip.text.x/100), H*(clip.text.y/100));
    targetCtx.restore();
  }
}

function createOverlayImageEl(url){
  const img = document.createElement('img');
  img.src = url;
  img.style.cssText='position:fixed;top:-9999px;left:-9999px;';
  document.getElementById('hiddenVideos').appendChild(img);
  return img;
}
function getOverlayImgEl(o){
  if(!o.content) return null;
  if(!overlayImgCache[o.id]) overlayImgCache[o.id] = createOverlayImageEl(o.content);
  return overlayImgCache[o.id];
}
function drawOverlays(t){
  const W=canvas.width, H=canvas.height;
  state.overlays.forEach(o=>drawSingleOverlay(o, t, W, H));
}
function drawSingleOverlay(o, t, W, H){
  if(t<o.start || t>o.end) return;
  const sinceStart = t-o.start, untilEnd = o.end-t;
  let alpha=1;
  if(o.fadeIn>0 && sinceStart<o.fadeIn) alpha *= clamp(sinceStart/o.fadeIn,0,1);
  if(o.fadeOut>0 && untilEnd<o.fadeOut) alpha *= clamp(untilEnd/o.fadeOut,0,1);
  if(alpha<=0.002) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.filter='none';
  let extraY=0, extraScale=1, textToShow=o.content;

  if(o.kind==='text' && o.animPreset && o.animPreset!=='none'){
    const animDur = Math.max(0.05, o.animDur||0.5);
    const ap = clamp(sinceStart/animDur,0,1);
    const eased = 1-Math.pow(1-ap,3);
    if(o.animPreset==='slide-up') extraY = (1-eased)*60;
    else if(o.animPreset==='slide-down') extraY = -(1-eased)*60;
    else if(o.animPreset==='pop') extraScale = 0.4+0.6*eased;
    else if(o.animPreset==='typewriter'){
      const chars = Math.floor(clamp(sinceStart/animDur,0,1)*o.content.length);
      textToShow = o.content.slice(0,chars);
    }
  }

  const cx = W*(o.x/100), cy = H*(o.y/100)+extraY;
  ctx.translate(cx,cy);
  ctx.rotate((o.rotation||0)*Math.PI/180);
  const scale = ((o.scale||100)/100)*extraScale;
  ctx.scale(scale,scale);

  if(o.kind==='text'){
    const weight = o.bold? '700':'500';
    const style = o.italic? 'italic':'normal';
    ctx.font = `${style} ${weight} ${o.size}px '${o.fontFamily||'Space Grotesk'}', sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(o.bgBox){
      const metrics = ctx.measureText(textToShow||' ');
      const pad = 16;
      const boxW = metrics.width + pad*2;
      const boxH = o.size + pad;
      ctx.save();
      ctx.fillStyle = o.bgColor||'rgba(0,0,0,0.5)';
      roundRectPath(ctx, -boxW/2, -boxH/2, boxW, boxH, 10);
      ctx.fill();
      ctx.restore();
    }
    if(o.outline && o.outlineWidth>0){
      ctx.lineWidth = o.outlineWidth;
      ctx.strokeStyle = o.outlineColor||'#000000';
      ctx.lineJoin='round';
      ctx.strokeText(textToShow,0,0);
    } else {
      ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=6;
    }
    ctx.fillStyle = o.color||'#ffffff';
    ctx.fillText(textToShow,0,0);
  } else if(o.kind==='sticker'){
    ctx.font = `${o.size}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(o.content,0,0);
  } else if(o.kind==='image'){
    const img = getOverlayImgEl(o);
    if(img && img.naturalWidth){
      const w=o.size, h=o.size*((o.naturalH||1)/(o.naturalW||1));
      if(o.radius>0){
        ctx.save();
        roundRectPath(ctx, -w/2,-h/2,w,h,(o.radius/100)*(Math.min(w,h)/2));
        ctx.clip();
        try{ ctx.drawImage(img,-w/2,-h/2,w,h); }catch(e){}
        ctx.restore();
      } else {
        try{ ctx.drawImage(img,-w/2,-h/2,w,h); }catch(e){}
      }
    } else {
      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.setLineDash([5,4]);
      ctx.strokeRect(-o.size/2,-o.size/2,o.size,o.size);
    }
  }
  ctx.restore();
}
function updateTimeDisplays(t,total){
  document.getElementById('timeCur').textContent = fmtTime(t);
  document.getElementById('timeTotal').textContent = fmtTime(total);
}
function updatePlayheadUI(t){ document.getElementById('playheadEl').style.left = (t*PX_PER_SEC)+'px'; }

/* ===================== Audio-Graph & Wiedergabe ===================== */
function ensureAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  streamDest = audioCtx.createMediaStreamDestination();
}
function connectClipAudio(clip){
  if(clip.audioConnected || !clip.videoEl) return;
  ensureAudioGraph();
  try{
    const src = audioCtx.createMediaElementSource(clip.videoEl);
    const gain = audioCtx.createGain();
    gain.gain.value = document.getElementById('volumeRange').value/100;
    src.connect(gain); gain.connect(audioCtx.destination); gain.connect(streamDest);
    clip.gainNode = gain; clip.audioConnected = true;
  }catch(e){}
}
function connectAudioClipGraph(a){
  if(a.connected || !a.audioEl) return;
  ensureAudioGraph();
  try{
    const src = audioCtx.createMediaElementSource(a.audioEl);
    const gain = audioCtx.createGain();
    const master = document.getElementById('volumeRange').value/100;
    gain.gain.value = master*(a.volume/100);
    src.connect(gain); gain.connect(audioCtx.destination); gain.connect(streamDest);
    a.gainNode = gain; a.connected = true;
  }catch(e){}
}
function pauseAllMedia(){
  state.clips.forEach(c=>{ if(c.videoEl && !c.videoEl.paused) c.videoEl.pause(); });
  state.audioClips.forEach(a=>{ if(a.audioEl && !a.audioEl.paused) a.audioEl.pause(); });
}
function syncAudioClips(playing, playhead){
  state.audioClips.forEach(a=>{
    if(!a.audioEl) return;
    const segStart=a.startTime, segEnd=a.startTime+(a.trimOut-a.trimIn);
    const inRange = playhead>=segStart && playhead<segEnd;
    if(playing && inRange){
      connectAudioClipGraph(a);
      const target = a.trimIn + (playhead-segStart);
      if(a.audioEl.paused){ try{ a.audioEl.currentTime=target; }catch(e){} a.audioEl.play().catch(()=>{}); }
      else if(Math.abs(a.audioEl.currentTime-target)>0.3){ try{ a.audioEl.currentTime=target; }catch(e){} }
    } else {
      if(!a.audioEl.paused) a.audioEl.pause();
    }
  });
}
function togglePlay(){
  const total = timelineLength();
  if(total<=0) return;
  if(!state.isPlaying){
    if(state.playheadTime>=total-0.02) state.playheadTime=0;
    ensureAudioGraph();
    if(audioCtx.state==='suspended') audioCtx.resume();
    state.isPlaying=true; lastTickTs=performance.now();
  } else {
    state.isPlaying=false; pauseAllMedia();
  }
  document.getElementById('btnPlay').textContent = state.isPlaying ? '❚❚' : '▶';
}
function seekTo(t){
  state.isPlaying=false; pauseAllMedia();
  document.getElementById('btnPlay').textContent='▶';
  state.playheadTime = clamp(t,0,timelineLength());
}

function tick(){
  const now = performance.now();
  const dt = lastTickTs ? (now-lastTickTs)/1000 : 0;
  lastTickTs = now;

  if(state.isPlaying){
    const layout = computeVideoLayout();
    const videoTotal = layout.length ? layout[layout.length-1].end : 0;
    const fullTotal = Math.max(videoTotal, overlaysAudioMaxEnd());
    if(state.playheadTime < fullTotal-0.01){
      if(state.playheadTime < videoTotal){
        const active = layout.filter(e=> state.playheadTime>=e.start && state.playheadTime<e.end);
        const activeIds = active.map(e=>e.clip.id);
        state.clips.forEach(c=>{ if(!activeIds.includes(c.id) && c.videoEl && !c.videoEl.paused) c.videoEl.pause(); });
        let blocked=false;
        active.forEach(e=>{
          if(e.clip.needsRelink || !e.clip.videoEl){ blocked=true; return; }
          if(e.clip.videoEl.paused){
            connectClipAudio(e.clip);
            const local = clamp(state.playheadTime-e.start,0,clipDuration(e.clip));
            try{ e.clip.videoEl.currentTime = e.clip.trimIn+local; }catch(err){}
            e.clip.videoEl.play().catch(()=>{});
          }
        });
        if(blocked || active.length===0){
          state.isPlaying=false; pauseAllMedia();
          document.getElementById('btnPlay').textContent='▶';
        } else {
          const primary = active[0];
          const local = primary.clip.videoEl.currentTime - primary.clip.trimIn;
          state.playheadTime = primary.start + clamp(local,0,clipDuration(primary.clip));
          if(active.length===1 && primary.clip.videoEl.currentTime >= primary.clip.trimOut-0.04){
            primary.clip.videoEl.pause();
            state.playheadTime = primary.end+0.02;
          }
        }
      } else {
        state.clips.forEach(c=>{ if(c.videoEl && !c.videoEl.paused) c.videoEl.pause(); });
        state.playheadTime += dt;
      }
      syncAudioClips(true, state.playheadTime);
    } else {
      state.isPlaying=false; pauseAllMedia();
      document.getElementById('btnPlay').textContent='▶';
      if(state.isExporting) finishExportRecording();
    }
  }
  renderFrame();
  if(state.isExporting){
    document.getElementById('recTime').textContent = fmtClock((Date.now()-recStartTime)/1000);
  }
  requestAnimationFrame(tick);
}

document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnSplit').addEventListener('click', splitClipAtPlayhead);
document.getElementById('btnDuplicate').addEventListener('click', duplicateSelectedVideoClip);
document.getElementById('volumeRange').addEventListener('input', e=>{
  const v = e.target.value/100;
  state.clips.forEach(c=>{ if(c.gainNode) c.gainNode.gain.value=v; });
  state.audioClips.forEach(a=>{ if(a.gainNode) a.gainNode.gain.value = v*(a.volume/100); });
});
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); togglePlay(); }
});

/* ===================== Medien hinzufügen / entfernen (Video) ===================== */
document.getElementById('mediaInput').addEventListener('change', e=>{
  const files = Array.from(e.target.files||[]);
  files.forEach(file=>{
    const clip = createClipFromFile(file);
    state.clips.push(clip);
    if(!state.selection.type) state.selection = {type:'video', id:clip.id};
  });
  e.target.value='';
  renderAll(); queueAutosave();
});
function urlStillUsedByOtherClip(clip){ return state.clips.some(c=>c!==clip && c.url===clip.url); }
function removeClip(id){
  const idx = state.clips.findIndex(c=>c.id===id);
  if(idx<0) return;
  const c = state.clips[idx];
  if(c.videoEl){ c.videoEl.pause(); c.videoEl.src=''; c.videoEl.remove(); }
  if(c.url && !urlStillUsedByOtherClip(c)) URL.revokeObjectURL(c.url);
  state.clips.splice(idx,1);
  if(state.selection.type==='video' && state.selection.id===id){
    state.selection = state.clips.length? {type:'video', id:state.clips[0].id} : {type:null,id:null};
  }
  seekTo(Math.min(state.playheadTime, timelineLength()));
  renderAll(); queueAutosave();
}
function moveClip(id, dir){
  const idx = state.clips.findIndex(c=>c.id===id);
  const j = idx+dir;
  if(idx<0||j<0||j>=state.clips.length) return;
  const tmp = state.clips[idx]; state.clips[idx]=state.clips[j]; state.clips[j]=tmp;
  renderAll(); queueAutosave();
}
function relinkClip(id, file){
  const idx = state.clips.findIndex(c=>c.id===id);
  if(idx<0) return;
  const old = state.clips[idx];
  const meta = {id:old.id,name:old.name,duration:old.duration,trimIn:old.trimIn,trimOut:old.trimOut,effects:old.effects,keyframes:old.keyframes,text:old.text,flipH:old.flipH,transitionOut:old.transitionOut};
  const clip = createClipFromFile(file, meta);
  clip.name = old.name;
  state.clips[idx]=clip;
  renderAll(); queueAutosave();
}
function selectItem(type,id){ state.selection={type,id}; renderAll(); }
function selectedClip(){ return state.selection.type==='video' ? state.clips.find(c=>c.id===state.selection.id) : null; }
function selectedAudio(){ return state.selection.type==='audio' ? state.audioClips.find(a=>a.id===state.selection.id) : null; }
function selectedOverlay(){ return state.selection.type==='overlay' ? state.overlays.find(o=>o.id===state.selection.id) : null; }

document.getElementById('audioInput').addEventListener('change', e=>{

});
function removeAudioClip(id){
  const idx = state.audioClips.findIndex(a=>a.id===id);

/* ===================== Overlays / Sticker ===================== */

    content: kind==='text' ? 'Text hinzufügen' : '',

    color:'#ffffff',

function buildStickerUI(){

function removeOverlay(id){
  const idx = state.overlays.findIndex(o=>o.id===id);
  if(idx<0) return;
  const o = state.overlays[idx];
  if(o.kind==='image' && o.content) URL.revokeObjectURL(o.content);

  state.overlays.splice(idx,1);
  if(state.selection.type==='overlay' && state.selection.id===id) state.selection={type:null,id:null};
  renderAll(); queueAutosave();
}

/* ===================== UI: Timeline (3 Spuren) ===================== */
function renderTimeline(){
  const fullTotal = timelineLength();
  const width = Math.max(fullTotal*PX_PER_SEC, 300);
  document.getElementById('timelineInner').style.width = width+'px';

  const ruler = document.getElementById('timelineRuler');
  ruler.innerHTML='';
  const step = PX_PER_SEC<40 ? 10 : (PX_PER_SEC<100 ? 5 : 1);
  for(let s=0; s<=Math.ceil(fullTotal)+5; s+=step){
    const tick = document.createElement('div');
    tick.className='ruler-tick'; tick.style.left=(s*PX_PER_SEC)+'px'; tick.textContent=fmtClock(s);
    ruler.appendChild(tick);
  }
  renderVideoTrack();
  renderAudioTrack();
  renderOverlayTrack();
}

function renderVideoTrack(){
  const track = document.getElementById('videoTrack');

  document.getElementById('videoEmptyMsg').classList.toggle('hidden', state.clips.length>0);
  const layout = computeVideoLayout();

  layout.forEach((entry,i)=>{
    const c = entry.clip;
    const left = entry.start*PX_PER_SEC;
    const w = Math.max(clipDuration(c)*PX_PER_SEC, 10);
    const block = document.createElement('div');
    block.className='blk video-blk'+(state.selection.type==='video'&&c.id===state.selection.id?' selected':'')+(c.needsRelink?' missing':'');
    block.style.left=left+'px'; block.style.width=w+'px';
    block.innerHTML = `
      <div class="blk-body"><div class="blk-title">${escapeHtml(c.name)}</div><div class="blk-dur">${fmtTime(clipDuration(c))}</div></div>
      <button class="blk-top-btn blk-del" title="Entfernen">✕</button>
      <button class="blk-top-btn blk-dup" title="Duplizieren">⧉</button>
      <div class="blk-kf-row"></div>
      <div class="blk-handle left"></div>
      <div class="blk-handle right"></div>`;
    const kfRow = block.querySelector('.blk-kf-row');
    EFFECT_PROPS.forEach(p=>{
      c.keyframes[p.key].forEach(k=>{
        const dot=document.createElement('div'); dot.className='kf-dot';
        dot.style.left=((k.t/Math.max(clipDuration(c),0.001))*100)+'%';
        dot.title=p.label+' @ '+k.t.toFixed(1)+'s';
        kfRow.appendChild(dot);

      }
    }
  });
}

function setupTrimHandle(handleEl, clip, side){
  handleEl.addEventListener('pointerdown', (e)=>{
    e.stopPropagation(); e.preventDefault();
    handleEl.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    const startIn = clip.trimIn, startOut = clip.trimOut;
    function onMove(ev){
      const dx = (ev.clientX-startX)/PX_PER_SEC;
      if(side==='in') clip.trimIn = clamp(startIn+dx, 0, clip.trimOut-0.2);
      else clip.trimOut = clamp(startOut+dx, clip.trimIn+0.2, clip.duration);
      renderTimeline(); renderFrame();
    }
    function onUp(){
      handleEl.releasePointerCapture(e.pointerId);
      handleEl.removeEventListener('pointermove', onMove);
      handleEl.removeEventListener('pointerup', onUp);
      queueAutosave();
    }
    handleEl.addEventListener('pointermove', onMove);
    handleEl.addEventListener('pointerup', onUp);
  });
}
function setupAudioTrimHandle(handleEl, a, side){
  handleEl.addEventListener('pointerdown', (e)=>{
    e.stopPropagation(); e.preventDefault();
    handleEl.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    const startIn = a.trimIn, startOut = a.trimOut;
    function onMove(ev){
      const dx = (ev.clientX-startX)/PX_PER_SEC;
      if(side==='in') a.trimIn = clamp(startIn+dx, 0, a.trimOut-0.2);
      else a.trimOut = clamp(startOut+dx, a.trimIn+0.2, a.duration);
      renderTimeline(); renderFrame();
    }
    function onUp(){
      handleEl.releasePointerCapture(e.pointerId);
      handleEl.removeEventListener('pointermove', onMove);
      handleEl.removeEventListener('pointerup', onUp);
      queueAutosave();
    }
    handleEl.addEventListener('pointermove', onMove);
    handleEl.addEventListener('pointerup', onUp);
  });
}
function setupOverlayEdgeHandle(handleEl, o, side){
  handleEl.addEventListener('pointerdown', (e)=>{
    e.stopPropagation(); e.preventDefault();
    handleEl.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    const startS = o.start, startE = o.end;
    function onMove(ev){
      const dx = (ev.clientX-startX)/PX_PER_SEC;
      if(side==='start') o.start = clamp(startS+dx, 0, o.end-0.3);
      else o.end = clamp(startE+dx, o.start+0.3, startE+100000);
      renderTimeline(); renderFrame();
    }
    function onUp(){
      handleEl.releasePointerCapture(e.pointerId);
      handleEl.removeEventListener('pointermove', onMove);
      handleEl.removeEventListener('pointerup', onUp);
      queueAutosave();
    }
    handleEl.addEventListener('pointermove', onMove);
    handleEl.addEventListener('pointerup', onUp);
  });
}
function setupDragMove(blockEl, item, kind){
  blockEl.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.blk-handle')||e.target.closest('.blk-top-btn')) return;
    e.stopPropagation();
    blockEl.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    let moved=false;
    const startVals = kind==='audio' ? {startTime:item.startTime} : {start:item.start, end:item.end};
    function onMove(ev){
      const dx = (ev.clientX-startX);
      if(Math.abs(dx)>3) moved=true;
      const dSec = dx/PX_PER_SEC;
      if(kind==='audio'){ item.startTime = clamp(startVals.startTime+dSec, 0, 100000); }
      else{
        const dur = startVals.end-startVals.start;
        const ns = clamp(startVals.start+dSec, 0, 100000);
        item.start = ns; item.end = ns+dur;
      }
      renderTimeline(); renderFrame();
    }
    function onUp(){
      blockEl.releasePointerCapture(e.pointerId);
      blockEl.removeEventListener('pointermove', onMove);
      blockEl.removeEventListener('pointerup', onUp);
      if(moved) queueAutosave();
      else selectItem(kind, item.id);
    }
    blockEl.addEventListener('pointermove', onMove);
    blockEl.addEventListener('pointerup', onUp);
  });
}

let draggingPlayhead=false;
function timelinePointerToTime(clientX){
  const wrap = document.getElementById('timelineScroll');
  const rect = wrap.getBoundingClientRect();
  const x = clientX-rect.left+wrap.scrollLeft;
  return clamp(x/PX_PER_SEC, 0, timelineLength());
}
document.getElementById('timelineScroll').addEventListener('pointerdown', (e)=>{
  if(e.target.closest('.blk')) return;
  draggingPlayhead=true;
  seekTo(timelinePointerToTime(e.clientX));
  renderFrame();
});
window.addEventListener('pointermove', (e)=>{ if(draggingPlayhead){ seekTo(timelinePointerToTime(e.clientX)); renderFrame(); } });
window.addEventListener('pointerup', ()=>{ draggingPlayhead=false; });

/* ===================== Overlay direkt im Vorschaubild verschieben ===================== */
let draggingOverlayOnCanvas=null, dragStartPX=null, dragStartXY=null;
canvas.addEventListener('pointerdown', (e)=>{
  const o = selectedOverlay();
  if(!o) return;
  if(state.playheadTime<o.start || state.playheadTime>o.end) return;
  draggingOverlayOnCanvas=o;
  dragStartPX={x:e.clientX,y:e.clientY};
  dragStartXY={x:o.x,y:o.y};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e)=>{
  if(!draggingOverlayOnCanvas) return;
  const rect = canvas.getBoundingClientRect();
  const dxPct = ((e.clientX-dragStartPX.x)/rect.width)*100;
  const dyPct = ((e.clientY-dragStartPX.y)/rect.height)*100;
  draggingOverlayOnCanvas.x = clamp(dragStartXY.x+dxPct,0,100);
  draggingOverlayOnCanvas.y = clamp(dragStartXY.y+dyPct,0,100);
  renderFrame();
});
canvas.addEventListener('pointerup', ()=>{ if(draggingOverlayOnCanvas) queueAutosave(); draggingOverlayOnCanvas=null; });

      item.addEventListener('click', (e)=>{ if(e.target.tagName==='BUTTON') return; seekTo(clipDisplayStart(clip)+k.t); renderAll(); });
      item.querySelector('button').addEventListener('click', (e)=>{ e.stopPropagation(); deleteKeyframe(clip, p.key, idx); renderAll(); });
      group.appendChild(item);
    });
    el.appendChild(group);
  });
}

  function bindRange(id, key, isFloat){

    const animSel = el.querySelector('#ovAnimPreset'); animSel.value=o.animPreset;
    animSel.addEventListener('change', ()=>{ o.animPreset=animSel.value; renderFrame(); queueAutosave(); });
    bindRange('ovAnimDur','animDur');
  } else if(o.kind==='image'){
    bindRange('ovRadius','radius');
  }
  bindRange('ovFadeIn','fadeIn');
  bindRange('ovFadeOut','fadeOut');
  bindRange('ovSize','size');
  bindRange('ovScale','scale');
  bindRange('ovRot','rotation');
}
function rgbaToHex(rgba){
  if(!rgba) return '#000000';
  if(rgba.startsWith('#')) return rgba;
  const m = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if(!m) return '#000000';
  return '#'+[1,2,3].map(i=>Number(m[i]).toString(16).padStart(2,'0')).join('');
}
function hexToRgba(hex, alpha){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

async function buildProjectMetadata(){
  const clips = state.clips.map(c=>({
    id:c.id, name:c.name, duration:c.duration, trimIn:c.trimIn, trimOut:c.trimOut,
    effects:c.effects, keyframes:c.keyframes, text:c.text, flipH:c.flipH, transitionOut:c.transitionOut,
    fileSize: c.sourceFile? c.sourceFile.size : (c.fileSizeHint||null),
  }));
  const audioClips = await Promise.all(state.audioClips.map(async a=>{
    let embedded=null;
    if(a.sourceFile && a.sourceFile.size<=MAX_AUDIO_EMBED_BYTES){
      try{ embedded = await fileToDataURL(a.sourceFile); }catch(e){}
    }
    return {id:a.id, name:a.name, duration:a.duration, trimIn:a.trimIn, trimOut:a.trimOut, startTime:a.startTime, volume:a.volume, embeddedAudio:embedded};
  }));
  const overlays = await Promise.all(state.overlays.map(async o=>{
    if(o.kind==='image'){
      let embedded=null;
      if(o.sourceFile && o.sourceFile.size<=MAX_IMG_EMBED_BYTES){
        try{ embedded = await fileToDataURL(o.sourceFile); }catch(e){}
      }
      return {id:o.id, kind:o.kind, start:o.start, end:o.end, x:o.x, y:o.y, scale:o.scale, rotation:o.rotation,
        size:o.size, radius:o.radius, fadeIn:o.fadeIn, fadeOut:o.fadeOut, naturalW:o.naturalW, naturalH:o.naturalH, embeddedImage:embedded};
    }
    return {id:o.id, kind:o.kind, start:o.start, end:o.end, x:o.x, y:o.y, scale:o.scale, rotation:o.rotation,
      content:o.content, size:o.size, color:o.color, fontFamily:o.fontFamily, bold:o.bold, italic:o.italic,
      outline:o.outline, outlineColor:o.outlineColor, outlineWidth:o.outlineWidth, bgBox:o.bgBox, bgColor:o.bgColor,
      animPreset:o.animPreset, animDur:o.animDur, fadeIn:o.fadeIn, fadeOut:o.fadeOut};
  }));
  return {
    version:3, projectName: state.projectName, createdAt: state.createdAt, savedAt: Date.now(),
    exportHistory: state.exportHistory, clips, audioClips, overlays,
  };
}
function setSaveStatus(mode, text){
  const box = document.getElementById('saveStatus');
  box.className='save-status '+mode;
  document.getElementById('saveStatusText').textContent = text;
}
async function autosaveNow(){
  if(!hasStorageApi){ setSaveStatus('', 'kein Auto-Speicher in dieser Ansicht'); return; }
  setSaveStatus('pending','wird gespeichert…');
  try{
    const payload = await buildProjectMetadata();
    await window.storage.set(AUTOSAVE_KEY, JSON.stringify(payload), false);
    state.lastSavedAt = Date.now();
    setSaveStatus('saved', 'gespeichert · '+fmtClock2(state.lastSavedAt));
  }catch(e){
    setSaveStatus('error','Speichern fehlgeschlagen');
    console.error('Autosave-Fehler', e);
  }
}
function queueAutosave(){
  setSaveStatus('pending','ungespeicherte Änderungen…');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveNow, 1200);
}
setInterval(()=>{ if(state.clips.length>0 || state.audioClips.length>0 || state.overlays.length>0) autosaveNow(); }, 20000);

function loadProjectFromData(data){
  state.projectName = data.projectName || 'Wiederhergestelltes Projekt';
  state.createdAt = data.createdAt || Date.now();
  state.exportHistory = data.exportHistory || [];
  document.getElementById('projectName').value = state.projectName;

  state.clips = (data.clips||[]).map(m=>{
    if(m.embeddedVideo){
      const blob = dataURLToBlob(m.embeddedVideo);
      const asFile = new File([blob], m.name, {type: blob.type});
      return createClipFromFile(asFile, m);
    }
    return createPlaceholderClip(m);
  });

  state.audioClips = (data.audioClips||[]).map(m=>{
    if(m.embeddedAudio){
      const blob = dataURLToBlob(m.embeddedAudio);
      const file = new File([blob], m.name, {type: blob.type});
      const url = URL.createObjectURL(file);
      const el = document.createElement('audio');
      el.src=url; el.preload='auto'; el.crossOrigin='anonymous';
      document.getElementById('hiddenVideos').appendChild(el);
      return {id:m.id, name:m.name, sourceFile:file, url, audioEl:el, duration:m.duration,
        trimIn:m.trimIn, trimOut:m.trimOut, startTime:m.startTime, volume:m.volume,
        gainNode:null, connected:false, needsRelink:false};
    }
    return {id:m.id, name:m.name, sourceFile:null, url:null, audioEl:null, duration:m.duration,
      trimIn:m.trimIn, trimOut:m.trimOut, startTime:m.startTime, volume:m.volume,
      gainNode:null, connected:false, needsRelink:true};
  });

  state.overlays = (data.overlays||[]).map(m=>{
    const base = makeOverlayDefaults(m.kind);
    const merged = Object.assign(base, m);
    if(m.kind==='image'){
      let contentUrl=null, sourceFile=null;
      if(m.embeddedImage){
        const blob = dataURLToBlob(m.embeddedImage);
        sourceFile = new File([blob], 'sticker', {type:blob.type});
        contentUrl = URL.createObjectURL(blob);
      }
      merged.content = contentUrl;
      merged.sourceFile = sourceFile;
      if(contentUrl){ overlayImgCache[merged.id] = createOverlayImageEl(contentUrl); }
    }
    return merged;
  });

  state.selection = {type:null,id:null};
  seekTo(0);
  renderAll();
}

async function tryRestoreAutosave(){
  if(!hasStorageApi) return;
  try{
    const res = await window.storage.get(AUTOSAVE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      if(data && ((data.clips&&data.clips.length)||(data.audioClips&&data.audioClips.length)||(data.overlays&&data.overlays.length))){
        loadProjectFromData(data);
        showRestoreBanner();

  }catch(e){}
}

/* ===================== Video-Export (Aufnahme) ===================== */
function pickMimeType(){
  const candidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const c of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c; }
  return '';
}
document.getElementById('btnExportVideo').addEventListener('click', ()=>{
  if(timelineLength()<=0){ alert('Füge zuerst mindestens ein Video, einen Ton oder ein Overlay hinzu.'); return; }
  if(state.clips.some(c=>c.needsRelink) || state.audioClips.some(a=>a.needsRelink)){
    alert('Es gibt Clips ohne verknüpfte Datei. Bitte zuerst neu zuordnen.'); return;
  }
  startExportRecording();
});
function startExportRecording(){
  ensureAudioGraph();
  if(audioCtx.state==='suspended') audioCtx.resume();
  state.clips.forEach(connectClipAudio);
  state.audioClips.forEach(connectAudioClipGraph);

  const canvasStream = canvas.captureStream(30);
  const combined = new MediaStream([...canvasStream.getVideoTracks(), ...streamDest.stream.getAudioTracks()]);
  const mime = pickMimeType();
  try{
    mediaRecorder = mime? new MediaRecorder(combined,{mimeType:mime}) : new MediaRecorder(combined);
  }catch(e){
    alert('Videoaufnahme wird von diesem Browser nicht unterstützt.');
    return;
  }
  recChunks=[];
  mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStopped;
  state.isExporting = true;
  recStartTime = Date.now();
  document.getElementById('recIndicator').classList.remove('hidden');
  document.getElementById('btnExportVideo').disabled = true;
  seekTo(0);
  mediaRecorder.start(250);
  requestAnimationFrame(()=>togglePlay());
}
function finishExportRecording(){
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
}
function onRecordingStopped(){
  const blob = new Blob(recChunks, {type:'video/webm'});
  const filename = sanitizeFilename(state.projectName)+'.webm';
  downloadBlob(blob, filename, 'video/webm');
  const durSec = (Date.now()-recStartTime)/1000;
  state.exportHistory.push({
    timestamp: Date.now(), filename, durationSec: Math.round(durSec*10)/10,
    sizeMB: Math.round(blob.size/1024/1024*10)/10, resolution: canvas.width+'×'+canvas.height,
  });
  state.isExporting=false;
  document.getElementById('recIndicator').classList.add('hidden');
  document.getElementById('btnExportVideo').disabled = false;
  queueAutosave();
}

    if(c.text && c.text.content) lines.push(`   Textüberlagerung (Clip-gebunden): "${c.text.content}"`);
    lines.push(``);
  });
  lines.push(`TON-SPUR`); lines.push(`--------`);
  if(state.audioClips.length===0) lines.push(`Kein Ton hinzugefügt.`);
  else state.audioClips.forEach((a,i)=>{
    lines.push(`${i+1}. ${a.name}${a.needsRelink?' [Datei fehlt]':''} – Start ${fmtTime(a.startTime)}, Länge ${fmtTime(a.trimOut-a.trimIn)}, Lautstärke ${a.volume}%`);
  });
  lines.push(``);

  else state.overlays.forEach((o,i)=>{
    const label = o.kind==='text'? `Text: "${o.content}"` : (o.kind==='sticker'? `Sticker: ${o.content}` : `Bild/GIF-Sticker`);
    lines.push(`${i+1}. ${label} – ${fmtTime(o.start)}–${fmtTime(o.end)}, Position ${o.x.toFixed(0)}%/${o.y.toFixed(0)}%`);
  });
  lines.push(``);
  lines.push(`EXPORTVERLAUF`); lines.push(`-------------`);
  if(state.exportHistory.length===0) lines.push(`Noch keine Videos exportiert.`);
  else state.exportHistory.forEach(h=>{
    lines.push(`${new Date(h.timestamp).toLocaleString('de-DE')} – ${h.filename} · ${h.durationSec}s · ${h.sizeMB} MB · ${h.resolution}`);
  });
  return lines.join('\n');
}
document.getElementById('btnReport').addEventListener('click', ()=>{
  document.getElementById('reportBody').textContent = buildReportText();
  document.getElementById('reportModal').classList.remove('hidden');
});
document.getElementById('reportClose').addEventListener('click', ()=>document.getElementById('reportModal').classList.add('hidden'));
document.getElementById('reportOk').addEventListener('click', ()=>document.getElementById('reportModal').classList.add('hidden'));
document.getElementById('reportDownload').addEventListener('click', ()=>{
  downloadBlob(buildReportText(), sanitizeFilename(state.projectName)+'_bericht.txt', 'text/plain');
});

/* ===================== Start ===================== */
buildStickerUI();
setSaveStatus('', hasStorageApi? 'noch nicht gespeichert' : 'Auto-Speicher nicht verfügbar');
tryRestoreAutosave();
renderAll();
requestAnimationFrame(tick);

})();
</script>
